name: kids_color_game
description: A kids coloring game built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  audioplayers: ^6.0.0
  google_mobile_ads: ^5.1.0
  in_app_purchase: ^3.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/pop.wav
    - assets/sounds/color_red.wav
    - assets/sounds/color_blue.wav
    - assets/sounds/color_green.wav
    - assets/sounds/color_yellow.wav
    - assets/sounds/color_orange.wav
    - assets/sounds/color_purple.wav
    - assets/sounds/color_pink.wav
    - assets/sounds/color_brown.wav
    - assets/sounds/color_black.wav
    - assets/sounds/color_white.wav
    - assets/sounds/color_grey.wav
    - assets/sounds/color_teal.wav
    - assets/sounds/great_job.wav
    - assets/sounds/excellent.wav
    - assets/sounds/amazing.wav
    - assets/sounds/congratulations.wav
