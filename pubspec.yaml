name: kids_color_game
description: A kids coloring game built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/pop.mp3
    - assets/sounds/color_red.mp3
    - assets/sounds/color_blue.mp3
    - assets/sounds/color_green.mp3
    - assets/sounds/color_yellow.mp3
    - assets/sounds/color_orange.mp3
    - assets/sounds/color_purple.mp3
    - assets/sounds/color_pink.mp3
    - assets/sounds/color_brown.mp3
    - assets/sounds/color_black.mp3
    - assets/sounds/color_white.mp3
    - assets/sounds/color_grey.mp3
    - assets/sounds/color_teal.mp3
    - assets/sounds/great_job.mp3
    - assets/sounds/excellent.mp3
    - assets/sounds/amazing.mp3
    - assets/sounds/congratulations.mp3
